name: taxi_tracker_pro
description: A comprehensive taxi fleet management application for tracking driver earnings, expenses, and maintenance.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0

  # State Management
  provider: ^6.1.1

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_local_notifications: ^16.3.0

  # Charts
  fl_chart: ^0.66.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3

  # PDF Export
  pdf: ^3.10.7
  printing: ^5.12.0
  path_provider: ^2.1.2

  # Excel Export
  excel: ^4.0.2

  # File Picker
  file_picker: ^6.1.1
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
